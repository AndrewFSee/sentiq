[project]
name = "newsfeed"
version = "0.1.0"
description = "Point-in-time-correct, LLM-scored financial news features for research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "polars>=1.0",
    "exchange-calendars>=4.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.12",
    "datasketch>=1.6",
    "anthropic>=1.13.0",
]

[project.optional-dependencies]
finbert = ["transformers>=4.40", "torch>=2.2"]

[project.scripts]
newsfeed = "newsfeed.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsfeed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "SIM", "RUF"]
# DTZ: forbid naive datetimes (datetime.now() without tz, etc.) -- core to PIT correctness.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket -q"
